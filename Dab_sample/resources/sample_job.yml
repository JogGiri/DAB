resources:
  jobs:
    yt_sample:
      name: yt_sample
      tasks:
        - task_key: yt_sample_nb
          notebook_task:
            notebook_path: ../src/notebooks/yt_sample.ipynb
            source: WORKSPACE
            base_parameters:
              catalog_name: ${var.catalog_name}
              schema_name: ${var.schema_name}
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
